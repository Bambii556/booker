services:
  db_test:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: booker
      POSTGRES_PASSWORD: booker
      POSTGRES_DB: booker_test
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booker -d booker_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis_test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_test_data:/data

volumes:
  redis_test_data: